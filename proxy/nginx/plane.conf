# ==============================================================================
# Plane Self-Hosted - Nginx Reverse Proxy Configuration Template
# Place in: /etc/nginx/sites-available/plane.conf
# Enable: ln -s /etc/nginx/sites-available/plane.conf /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name plane.yourdomain.com;

    # ACME Challenge for Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Primary Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plane.yourdomain.com;

    # SSL Certificates (Configure paths to your certificates)
    ssl_certificate /etc/letsencrypt/live/plane.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plane.yourdomain.com/privkey.pem;

    # Modern SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Large File Uploads (Matches FILE_SIZE_LIMIT in .env)
    client_max_body_size 100M;
    client_body_timeout 120s;
    send_timeout 120s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Reverse Proxy to Plane Internal Proxy / Gateway
    location / {
        # Point to the host port where Plane's proxy is mapped (e.g. 127.0.0.1:80 or custom port)
        proxy_pass http://127.0.0.1:80;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Live Collaboration Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer Optimization
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
